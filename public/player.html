<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Quiz — Jogador</title>
<style>
  :root {
    --verde:    #2ecc71;
    --vermelho: #e74c3c;
    --azul:     #3498db;
    --amarelo:  #f1c40f;
    --laranja:  #e67e22;
    --roxo:     #9b59b6;
    --bg:       #1a1a2e;
    --card:     #16213e;
    --text:     #eaeaea;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    gap: 16px;
  }
  h1 { font-size: 1.6rem; text-align: center; }
  input[type=text] {
    width: 100%;
    max-width: 320px;
    padding: 14px 18px;
    font-size: 1.2rem;
    border-radius: 10px;
    border: 2px solid #444;
    background: var(--card);
    color: var(--text);
    text-align: center;
  }
  button.main {
    padding: 14px 40px;
    font-size: 1.2rem;
    border: none;
    border-radius: 10px;
    background: var(--verde);
    color: #fff;
    cursor: pointer;
    font-weight: bold;
    width: 100%;
    max-width: 320px;
  }
  .msg {
    font-size: 1.1rem;
    text-align: center;
    color: #bbb;
    max-width: 300px;
  }
  .score {
    font-size: 1rem;
    color: var(--amarelo);
    font-weight: bold;
  }
  /* Answer buttons */
  #answerGrid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    width: 100%;
    max-width: 360px;
  }
  .ansBtn {
    border: none;
    border-radius: 14px;
    padding: 28px 10px;
    font-size: 1.6rem;
    font-weight: 900;
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 90px;
    transition: transform .1s, opacity .2s;
  }
  .ansBtn:active { transform: scale(.95); }
  .ansBtn.selected { outline: 4px solid #fff; }
  .ansBtn.correct  { outline: 5px solid #fff; opacity: 1 !important; }
  .ansBtn.wrong    { opacity: .3; }
  .ansBtn:disabled { cursor: default; }
  /* feedback */
  #feedback {
    font-size: 1.3rem;
    text-align: center;
    font-weight: bold;
    display: none;
  }
  .correct-fb { color: var(--verde); }
  .wrong-fb   { color: var(--vermelho); }
</style>
</head>
<body>

<!-- JOIN -->
<div id="joinView">
  <h1>🎮 Quiz ao Vivo</h1>
  <input id="nameInput" type="text" placeholder="O teu nome" maxlength="20" autocomplete="off">
  <button class="main" onclick="joinGame()">Entrar</button>
  <div class="msg" id="joinMsg"></div>
</div>

<!-- WAITING -->
<div id="waitView" style="display:none">
  <h1>✅ Entraste!</h1>
  <div class="msg" id="waitMsg">Aguarda o início do jogo…</div>
  <div class="score" id="scoreDisplay">Pontos: 0</div>
</div>

<!-- ANSWER -->
<div id="answerView" style="display:none">
  <div class="msg">Escolhe a tua resposta!</div>
  <div id="answerGrid"></div>
  <div id="feedback"></div>
</div>

<!-- END -->
<div id="endView" style="display:none">
  <h1>🎉 Fim!</h1>
  <div class="msg" id="endMsg"></div>
</div>

<script>
const COLORS  = ["#e74c3c","#3498db","#2ecc71","#f1c40f","#e67e22","#9b59b6"];
const LETTERS = ["A","B","C","D"];

let ws, score = 0, myName = "", answered = false, canAnswer = false;

let pingInterval = null;
let playerName = "";
let currentView = "joinView"; // track what screen we're on

function connect() {
  ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}`);
  ws.onmessage = e => handleMsg(JSON.parse(e.data));
  ws.onopen = () => {
    // Ping every 15s to keep connection alive (below Railway's 60s timeout)
    if (pingInterval) clearInterval(pingInterval);
    pingInterval = setInterval(() => {
      if (ws.readyState === 1) ws.send(JSON.stringify({ type: "ping" }));
    }, 15000);
    // Auto-rejoin silently if we had a name (reconnection)
    if (playerName) {
      ws.send(JSON.stringify({ type: "playerJoin", name: playerName }));
    }
  };
  ws.onclose = () => {
    if (pingInterval) { clearInterval(pingInterval); pingInterval = null; }
    // Reconnect quickly and silently
    setTimeout(connect, 1000);
  };
  ws.onerror = () => {
    ws.close();
  };
}

// Keep-alive via Page Visibility API — reconnect when tab becomes visible again
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && ws.readyState !== 1) {
    connect();
  }
});

function handleMsg(msg) {
  switch(msg.type) {
    case "error":
      document.getElementById("joinMsg").textContent = "⚠️ " + msg.msg;
      break;
    case "joined":
      myName = msg.name;
      show("waitView");
      break;
    case "waiting":
      document.getElementById("waitMsg").textContent = msg.msg;
      show("waitView");
      break;
    case "canAnswer":
      // timer started on host, player can now answer
      canAnswer = true;
      answered  = false;
      enableButtons();
      break;
    case "answerAck":
      // mark selected
      document.querySelectorAll(".ansBtn").forEach((b,i) => {
        if (i === msg.selected) b.classList.add("selected");
        b.disabled = true;
      });
      document.getElementById("feedback").style.display = "none";
      break;
    case "reveal":
      revealResult(msg.correta);
      break;
    case "end":
      show("endView");
      const top = msg.ranking[0];
      document.getElementById("endMsg").textContent =
        top ? `Vencedor: ${top.name} com ${top.score} pts!\nA tua pontuação: ${score}` : `Pontuação final: ${score}`;
      break;
  }
}

function joinGame() {
  const name = document.getElementById("nameInput").value.trim();
  if (!name) return;
  playerName = name;
  ws.send(JSON.stringify({ type: "playerJoin", name }));
}

function show(id) {
  ["joinView","waitView","answerView","endView"].forEach(v =>
    document.getElementById(v).style.display = v === id ? "flex" : "none");
  document.getElementById(id).style.flexDirection = "column";
  document.getElementById(id).style.alignItems    = "center";
  document.getElementById(id).style.gap           = "16px";
}

function enableButtons() {
  // We need question options — they were sent with the question, but player only
  // receives canAnswer signal. The grid was built when we showed answerView.
  document.querySelectorAll(".ansBtn").forEach(b => { b.disabled = false; });
  show("answerView");
}

// Build answer buttons when question starts (we listen for "waiting" which
// carries no options). Instead we build them on canAnswer using stored opcoes.
let storedOpcoes = [];

function buildAnswerGrid(opcoes) {
  storedOpcoes = opcoes;
  const grid = document.getElementById("answerGrid");
  grid.style.gridTemplateColumns = opcoes.length <= 2 ? "1fr" : "1fr 1fr";
  grid.innerHTML = opcoes.map((opt, i) => `
    <button class="ansBtn" id="ab${i}" style="background:${COLORS[i]}"
      onclick="sendAnswer(${i})" disabled>
      ${LETTERS[i]} ${opt}
    </button>`).join("");
  document.getElementById("feedback").style.display = "none";
}

// Override handleMsg to intercept question data sent to players
const _orig = handleMsg;
// We patch in the question event — server now sends canAnswer which triggers show
// But we need opcoes. Server doesn't send opcoes to players by design (anti-cheat).
// So we build generic buttons and fill labels when canAnswer fires.
// Actually we DO want to send opcoes at canAnswer time from server — let's handle
// the case where server sends canAnswer with opcoes included.

function handleMsg(msg) {
  switch(msg.type) {
    case "error":
      document.getElementById("joinMsg").textContent = "⚠️ " + msg.msg;
      break;
    case "joined":
      myName = msg.name;
      show("waitView");
      break;
    case "waiting":
      document.getElementById("waitMsg").textContent = msg.msg;
      show("waitView");
      break;
    case "canAnswer":
      canAnswer = true;
      answered  = false;
      // opcoes may be included
      if (msg.opcoes) buildAnswerGrid(msg.opcoes);
      else if (storedOpcoes.length) buildAnswerGrid(storedOpcoes);
      show("answerView");
      enableButtons();
      break;
    case "question":
      // store opcoes for when canAnswer fires
      if (msg.opcoes) storedOpcoes = msg.opcoes;
      document.getElementById("waitMsg").textContent = "Aguarda o vídeo no ecrã…";
      show("waitView");
      break;
    case "answerAck":
      document.querySelectorAll(".ansBtn").forEach((b,i) => {
        if (i === msg.selected) b.classList.add("selected");
        b.disabled = true;
      });
      break;
    case "reveal":
      revealResult(msg.correta);
      break;
    case "end":
      show("endView");
      document.getElementById("endMsg").textContent =
        `A tua pontuação final: ${score} pts`;
      break;
  }
}

function sendAnswer(i) {
  if (!canAnswer || answered) return;
  answered = true;
  ws.send(JSON.stringify({ type: "answer", index: i }));
  document.querySelectorAll(".ansBtn").forEach((b,j) => {
    if (j === i) b.classList.add("selected");
    b.disabled = true;
  });
}

function revealResult(correta) {
  document.querySelectorAll(".ansBtn").forEach((b,i) => {
    b.disabled = true;
    b.classList.remove("selected");
    if (i === correta) b.classList.add("correct");
    else               b.classList.add("wrong");
  });
  const fb = document.getElementById("feedback");
  const myBtn = document.querySelector(".ansBtn.selected") ||
                document.querySelector(".ansBtn[data-chosen]");
  // Check if player answered correctly
  const selectedBtns = [...document.querySelectorAll(".ansBtn")].filter(b =>
    b.classList.contains("correct") && b.dataset.chosen);
  fb.style.display = "block";
  // Simple feedback based on whether we answered the correct one
  // (actual score is tracked server-side; here just show encouragement)
  fb.textContent = "👀 Vê o resultado no ecrã!";
  fb.className = "";
  updateScoreDisplay();
}

function updateScoreDisplay() {
  const el = document.getElementById("scoreDisplay");
  if (el) el.textContent = `Pontos: ${score}`;
}

connect();
document.getElementById("nameInput").addEventListener("keydown", e => {
  if (e.key === "Enter") joinGame();
});

// Also send question event to players so they see opcoes on canAnswer
// (server sends canAnswer without opcoes by default — we handle it above with storedOpcoes)
</script>
</body>
</html>
